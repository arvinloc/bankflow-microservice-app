

services:
  postgres:
    image: postgres:16
    container_name: keycloak_postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - keycloak_net

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "9090:8080"
    depends_on:
      - postgres
    networks:
      - keycloak_net


  redis:
    image: redis:7.2-alpine
    container_name: redis_app
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-default_secure_password}
    networks:
        - keycloak_net



  accounts-service:
    build: ./services/accounts-service
    container_name: accounts_service
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+asyncpg://accounts:accounts@postgres:5432/accounts
      KEYCLOAK_ISSUER: http://localhost:9090/realms/bank
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/bank/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: bank-api
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keycloak_net

  transaction-service:
    build: ./services/transaction-service
    container_name: transaction_service
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+asyncpg://transactions:transactions@postgres:5432/transactions
      KEYCLOAK_ISSUER: http://localhost:9090/realms/bank
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/bank/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: bank-api
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/bank/protocol/openid-connect/token
      KEYCLOAK_CLIENT_ID: transaction-service
      KEYCLOAK_CLIENT_SECRET: ${TRANSACTION_CLIENT_SECRET}
      ACCOUNTS_SERVICE_URL: http://accounts-service:8000
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      accounts-service:
        condition: service_started
    networks:
      - keycloak_net


volumes:
  postgres_data:
  redis_data:

networks:
  keycloak_net: